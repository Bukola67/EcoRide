services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoride_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://ecoride_user:ecoride_password@mysql:3306/ecoride?serverVersion=8.0&charset=utf8mb4"
      MONGODB_URL: "mongodb://ecoride_mongo:ecoride_mongo_password@mongo:27017"
      MONGODB_DB: "ecoride"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: ecoride_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride_user
      MYSQL_PASSWORD: ecoride_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: ecoride_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecoride_mongo
      MONGO_INITDB_ROOT_PASSWORD: ecoride_mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecoride_mailpit
    ports:
      - "8025:8025"
      - "1026:1025"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecoride_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
  mongo_data: