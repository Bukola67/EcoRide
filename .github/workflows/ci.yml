name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecoride
          MYSQL_USER: ecoride_user
          MYSQL_PASSWORD: ecoride_password
          MYSQL_ROOT_PASSWORD: root_password_change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_password_change_me"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ecoride_mongo
          MONGO_INITDB_ROOT_PASSWORD: ecoride_mongo_password
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql intl mbstring xml
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Wait for MySQL to be ready
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -uroot \
            -proot_password_change_me \
            -e "
              CREATE DATABASE IF NOT EXISTS ecoride_test
                CHARACTER SET utf8mb4
                COLLATE utf8mb4_unicode_ci;

              GRANT ALL PRIVILEGES ON ecoride_test.*
                TO 'ecoride_user'@'%';

              GRANT ALL PRIVILEGES ON ecoride_test.*
                TO 'ecoride_user'@'localhost';

              FLUSH PRIVILEGES;

              SHOW GRANTS FOR 'ecoride_user'@'%';
            "

      - name: Create test database and grant access
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password_change_me \
            -e "CREATE DATABASE IF NOT EXISTS ecoride_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run migrations (test)
        env:
          APP_ENV: test
          DATABASE_URL: 'mysql://ecoride_user:ecoride_password@127.0.0.1:3306/ecoride?serverVersion=8.0&charset=utf8mb4'
          MONGODB_URL: 'mongodb://ecoride_mongo:ecoride_mongo_password@127.0.0.1:27017'
          MONGODB_DB: 'ecoride'
          MAILER_DSN: 'null://null'
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load fixtures (test)
        env:
          APP_ENV: test
          DATABASE_URL: 'mysql://ecoride_user:ecoride_password@127.0.0.1:3306/ecoride?serverVersion=8.0&charset=utf8mb4'
          MONGODB_URL: 'mongodb://ecoride_mongo:ecoride_mongo_password@127.0.0.1:27017'
          MONGODB_DB: 'ecoride'
          MAILER_DSN: 'smtp://localhost:1025'
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run PHPUnit
        env:
          APP_ENV: test
          DATABASE_URL: 'mysql://ecoride_user:ecoride_password@127.0.0.1:3306/ecoride?serverVersion=8.0&charset=utf8mb4'
          MONGODB_URL: 'mongodb://ecoride_mongo:ecoride_mongo_password@127.0.0.1:27017'
          MONGODB_DB: 'ecoride'
          MAILER_DSN: 'smtp://localhost:1025'
        run: php bin/phpunit